name: crisis-indicators
channels:
  - conda-forge
dependencies:
  - python=3.11
  # pandas pinned to the 2.x branch: pandas 3.0 (released April 2026)
  # broke the API used by pandas_datareader; many scientific stacks have
  # not yet caught up.
  - pandas>=2.2,<3.0
  - numpy>=1.26,<2.0
  - scipy>=1.13
  - statsmodels>=0.14
  - matplotlib>=3.8
  - jupyterlab
  - ipykernel
  - nbconvert
  - pip
  - pip:
    - yfinance
    - pandas-datareader
